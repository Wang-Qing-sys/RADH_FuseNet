[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "radh-fusenet-reference"
version = "0.1.0"
description = "Independent, research-only PyTorch reference implementation of the supplied RADH-FuseNet manuscript"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "torch>=2.2,<3"]

[project.scripts]
radh = "radh.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["radh*"]

[tool.setuptools.package-data]
radh = ["configs/*.json"]
